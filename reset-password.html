
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Parsh.online</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box">
  <main style="width:100%;max-width:420px;background:#111a30;color:white;padding:24px;border-radius:16px;box-sizing:border-box">
    <h1>Reset Password</h1>
    <p>अपने अकाउंट के लिए नया पासवर्ड बनाएँ।</p>

    <form id="resetForm">
      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" minlength="8"
        autocomplete="new-password" required
        style="display:block;width:100%;box-sizing:border-box;padding:12px;margin:10px 0">

      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" type="password" minlength="8"
        autocomplete="new-password" required
        style="display:block;width:100%;box-sizing:border-box;padding:12px;margin:10px 0">

      <button id="resetButton" type="submit"
        style="width:100%;padding:14px;margin-top:12px">
        Update Password
      </button>

      <p id="resetMessage" role="status"></p>
    </form>

    <a href="index.html">Back to Login</a>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
